# PathBrain — deploy the pre-built image from GitHub Container Registry (GHCR).
#
# Use this on Unraid / any Docker host instead of building from source: it pulls
# ghcr.io/jmorganthall/pathbrain:latest, which is published automatically by the
# GitHub Actions workflow on every push to main.
#
# Quick start:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Update later:
#   docker compose -f docker-compose.ghcr.yml pull && \
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Configuration: either set the PATHBRAIN_* variables in a .env file next to this
# compose file (Docker Compose auto-loads it), or edit the environment block
# below. Pin a specific release by changing ":latest" to e.g. ":v0.1.0".

services:
  pathbrain:
    image: ghcr.io/jmorganthall/pathbrain:latest
    container_name: pathbrain
    restart: unless-stopped
    ports:
      - "8000:8000"
    # --- Resource guardrails -------------------------------------------------
    # PathBrain must fail locally rather than take the host down with it.
    #
    # init: PID 1 in a container does not reap orphans, and uvicorn is PID 1 here. When a
    # Chromium is killed (by us, or by the host's OOM killer) its surviving children are
    # re-parented to PID 1, exit, and stay as zombies forever because nothing ever calls
    # wait() on them — the 388 zombie Chrome processes observed on the host. `init: true`
    # puts a real init (tini) at PID 1, whose entire job is to reap them.
    #
    # mem_limit: a ceiling the kernel enforces on the *container*, so a runaway browser
    # tree is OOM-killed inside PathBrain instead of the host killing whatever it likes
    # (nginx and Docker's inotify were the collateral damage last time). 4g fits one
    # Chromium plus the API comfortably; raise it if legitimate runs get killed, and read
    # /api/health/pipeline's `processes` block before you do — a climbing `drivers` count
    # is a leak, not a capacity problem.
    #
    # pids_limit: the backstop that makes a leak self-limiting. Tuned UP from the 256 that
    # reads naturally from a process count, because the cgroup pids controller limits
    # *tasks* — threads included — not processes. One headless Chromium runs a few hundred
    # threads across its process tree and uvicorn's own pool adds ~50, so 256 would kill
    # legitimate measurements on the first page load. 2048 still leaves ~10x headroom for
    # one browser while capping a runaway long before it can reach the 887-process,
    # 20 GiB pile-up that took the host down.
    init: true
    mem_limit: 4g
    pids_limit: 2048
    # Health check hits the static JSON endpoint ONLY. It must never touch a path that
    # launches a browser or starts a measurement: Docker re-runs this on a timer forever,
    # so anything with a side effect becomes a permanent background workload — and a leak
    # in it would be re-created every interval.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      # 120s, not 60s: nothing here is latency-critical, and the host already reported an
      # unexplained once-a-minute container churn — a probe on the same cadence would only
      # make that harder to tell apart.
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Allow the ICMP benchmark to send unprivileged ping (SOCK_DGRAM) sockets.
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    environment:
      # Container timezone — the scheduler's nightly baseline-test time and the experiment
      # window hours run on the container's *local* wall-clock, so set this to your zone
      # (e.g. America/New_York) to make "Run at (local)" mean your local time. Defaults to UTC.
      TZ: "${TZ:-UTC}"

      # Storage (SQLite + browser artifacts on the persistent volume)
      PATHBRAIN_DATABASE_URL: "sqlite:////data/pathbrain.db"
      PATHBRAIN_ARTIFACT_DIR: "/data/artifacts"
      PATHBRAIN_LOG_LEVEL: "INFO"

      # Config discovery: "mock" (default) or "opnsense"
      PATHBRAIN_CONFIG_PROVIDER: "${PATHBRAIN_CONFIG_PROVIDER:-mock}"

      # OPNsense API (only used when provider is "opnsense")
      PATHBRAIN_OPNSENSE_URL: "${PATHBRAIN_OPNSENSE_URL:-}"
      PATHBRAIN_OPNSENSE_API_KEY: "${PATHBRAIN_OPNSENSE_API_KEY:-}"
      PATHBRAIN_OPNSENSE_API_SECRET: "${PATHBRAIN_OPNSENSE_API_SECRET:-}"
      PATHBRAIN_OPNSENSE_VERIFY_TLS: "${PATHBRAIN_OPNSENSE_VERIFY_TLS:-false}"

      # One-click self-update via Watchtower's HTTP API (both must be set to enable the
      # "Update now" button). URL is the Watchtower HTTP API base (e.g. http://192.168.2.6:8998);
      # token is Watchtower's WATCHTOWER_HTTP_API_TOKEN. These are unprefixed (not PATHBRAIN_*).
      # Keep the token in a .env file.
      WATCHTOWER_URL: "${WATCHTOWER_URL:-}"
      WATCHTOWER_TOKEN: "${WATCHTOWER_TOKEN:-}"
    volumes:
      - pathbrain-data:/data

volumes:
  pathbrain-data:
