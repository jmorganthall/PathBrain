name: archguard

# The ratchet on the one chain and on data-layer drift: a count may go down, never up.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  archguard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: archguard (counts must not rise above .archguard-baseline.json)
        run: node scripts/archguard.mjs
